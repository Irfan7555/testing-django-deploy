
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">

        <h2 class="text-center mb-4">My Todo List</h2>

        <form method="POST" action="{% url 'add_task' %}">
            {% csrf_token %}

            <div class="input-group mb-4">
                <input type="text" name="title"
                       class="form-control"
                       placeholder="Enter a new task..."
                       required>

                <button class="btn btn-primary" type="submit">
                    Add Task
                </button>
            </div>
        </form>

        <h5>My Tasks</h5>

        {% for task in tasks %}
        <div class="d-flex justify-content-between align-items-center border rounded p-3 mb-2">

            <span class="{% if task.completed %}text-decoration-line-through text-muted{% endif %}">
                {{ task.title }}
            </span>

            <div class="d-flex gap-2">

                <a href="{% url 'complete_task' task.id %}"
                   class="btn btn-sm btn-success">
                    {% if task.completed %}Undo{% else %}Done{% endif %}
                </a>

                <a href="{% url 'delete_task' task.id %}"
                   class="btn btn-sm btn-danger">
                    Delete
                </a>

            </div>
        </div>

        {% empty %}
        <p class="text-center text-muted">No tasks available. Add your first task!</p>
        {% endfor %}

    </div>
</div>

</body>
</html>
